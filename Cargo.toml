[package]
name = "mcpscope"
version = "0.1.0"
edition = "2024"
description = "tcpdump for MCP: record agent/server traffic without changing the conversation"
license = "MIT"
repository = "https://github.com/Lavanic/mcpscope"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "7.0.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
